<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Noto Sans CJK SC, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <!-- 层标题 -->
  <g font-size="12" fill="#898781">
    <text x="20" y="28">① 数据采集层</text><text x="245" y="28">② 预处理与特征层</text><text x="470" y="28">③ 智能诊断层</text><text x="695" y="28">④ 可视化交互层</text>
  </g>
  <g stroke="#e1e0d9" stroke-dasharray="4 4"><line x1="232" y1="16" x2="232" y2="390"/><line x1="457" y1="16" x2="457" y2="390"/><line x1="682" y1="16" x2="682" y2="390"/></g>
  <!-- 采集 -->
  <g>
    <rect x="20" y="45" width="195" height="74" rx="8" fill="#cde2fb" stroke="#2a78d6"/>
    <text x="117" y="70" text-anchor="middle" font-weight="600">GPT 训练进程 ×12</text>
    <text x="117" y="90" text-anchor="middle" font-size="11" fill="#52514e">超参扫描 + 故障注入</text>
    <text x="117" y="106" text-anchor="middle" font-size="11" fill="#52514e">崩溃-断点续训</text>
    <rect x="20" y="140" width="195" height="120" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="117" y="162" text-anchor="middle" font-weight="600">探针（Probes）</text>
    <text x="34" y="184" font-size="11" fill="#52514e">每步：loss / lr / 梯度范数 / 吞吐</text>
    <text x="34" y="202" font-size="11" fill="#52514e">每步：14 个模块梯度范数</text>
    <text x="34" y="220" font-size="11" fill="#52514e">每10步：权重范数、更新比</text>
    <text x="34" y="238" font-size="11" fill="#52514e">每50步：注意力熵、激活 RMS</text>
    <text x="34" y="254" font-size="11" fill="#52514e">每100步：训练/验证损失</text>
    <rect x="20" y="282" width="195" height="50" rx="8" fill="#f0efec" stroke="#c3c2b7"/>
    <text x="117" y="303" text-anchor="middle" font-weight="600">JSONL 原始日志</text>
    <text x="117" y="321" text-anchor="middle" font-size="11" fill="#52514e">61,695 行 · 24.8 MB</text>
    <line x1="117" y1="119" x2="117" y2="138" stroke="#52514e" marker-end="url(#a)"/>
    <line x1="117" y1="260" x2="117" y2="280" stroke="#52514e" marker-end="url(#a)"/>
  </g>
  <!-- 预处理 -->
  <g>
    <rect x="245" y="45" width="200" height="106" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="345" y="67" text-anchor="middle" font-weight="600">数据清洗</text>
    <text x="258" y="88" font-size="11" fill="#52514e">非有限值解析 · 续训去重</text>
    <text x="258" y="106" font-size="11" fill="#52514e">缺口检测 · 计时污染剔除</text>
    <text x="258" y="124" font-size="11" fill="#52514e">EMA / 滚动中位数平滑</text>
    <text x="258" y="142" font-size="11" fill="#52514e">质量报告</text>
    <rect x="245" y="165" width="200" height="80" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="345" y="187" text-anchor="middle" font-weight="600">特征工程</text>
    <text x="258" y="208" font-size="11" fill="#52514e">损失残差 · 滚动波动率</text>
    <text x="258" y="226" font-size="11" fill="#52514e">稳健 z 分数 · 运行级摘要</text>
    <rect x="245" y="259" width="200" height="73" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="345" y="281" text-anchor="middle" font-weight="600">维度规约</text>
    <text x="258" y="302" font-size="11" fill="#52514e">14 维模块梯度 → PCA 轨迹</text>
    <text x="258" y="320" font-size="11" fill="#52514e">384 维字符嵌入 → t-SNE</text>
  </g>
  <line x1="215" y1="307" x2="243" y2="98" stroke="#52514e" marker-end="url(#a)"/>
  <!-- 诊断 -->
  <g>
    <rect x="470" y="45" width="200" height="40" rx="8" fill="#cde2fb" stroke="#2a78d6"/><text x="570" y="70" text-anchor="middle" font-weight="600">Planner 路由</text>
    <rect x="470" y="100" width="200" height="40" rx="8" fill="#cde2fb" stroke="#2a78d6"/><text x="570" y="125" text-anchor="middle" font-weight="600">Monitor · 9 类检测器</text>
    <rect x="470" y="155" width="200" height="40" rx="8" fill="#cde2fb" stroke="#2a78d6"/><text x="570" y="180" text-anchor="middle" font-weight="600">Diagnostician · 取证+知识库</text>
    <rect x="470" y="210" width="200" height="40" rx="8" fill="#cde2fb" stroke="#2a78d6"/><text x="570" y="235" text-anchor="middle" font-weight="600">Advisor · 处置建议</text>
    <rect x="470" y="265" width="95" height="40" rx="8" fill="#c9eedf" stroke="#1baf7a"/><text x="517" y="290" text-anchor="middle" font-size="12" font-weight="600">Comparator</text>
    <rect x="575" y="265" width="95" height="40" rx="8" fill="#cde2fb" stroke="#2a78d6"/><text x="622" y="290" text-anchor="middle" font-size="12" font-weight="600">Reporter</text>
    <rect x="470" y="318" width="200" height="30" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-dasharray="4 3"/><text x="570" y="338" text-anchor="middle" font-size="11" fill="#52514e">可选 LLM 证据约束润色</text>
    <line x1="570" y1="85" x2="570" y2="98" stroke="#52514e" marker-end="url(#a)"/>
    <line x1="570" y1="140" x2="570" y2="153" stroke="#52514e" marker-end="url(#a)"/>
    <line x1="570" y1="195" x2="570" y2="208" stroke="#52514e" marker-end="url(#a)"/>
    <line x1="622" y1="250" x2="622" y2="263" stroke="#52514e" marker-end="url(#a)"/>
    <line x1="565" y1="285" x2="573" y2="285" stroke="#52514e" marker-end="url(#a)"/>
    <line x1="622" y1="305" x2="622" y2="316" stroke="#52514e" stroke-dasharray="3 3"/>
    <text x="570" y="370" text-anchor="middle" font-size="11" fill="#898781">执行轨迹 trace（全部消息与工具调用）</text>
  </g>
  <line x1="445" y1="200" x2="468" y2="120" stroke="#52514e" marker-end="url(#a)"/>
  <!-- 可视化 -->
  <g>
    <rect x="695" y="45" width="190" height="290" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="790" y="67" text-anchor="middle" font-weight="600">ECharts 单页仪表盘</text>
    <g font-size="11" fill="#52514e">
      <text x="708" y="92">· KPI 磁贴 + 健康总览表</text>
      <text x="708" y="113">· 损失/梯度/更新比/学习率</text>
      <text x="718" y="130">（时间轴联动刷选）</text>
      <text x="708" y="151">· 模块×步 梯度热力图</text>
      <text x="708" y="172">· 层×头 注意力熵（可播放）</text>
      <text x="708" y="193">· PCA 训练轨迹</text>
      <text x="708" y="214">· 超参数平行坐标</text>
      <text x="708" y="235">· 字符嵌入 t-SNE</text>
      <text x="708" y="256">· 智能体诊断卡片与轨迹</text>
      <text x="708" y="277">· 数据质量表</text>
    </g>
    <rect x="705" y="290" width="170" height="34" rx="6" fill="#cde2fb" stroke="#2a78d6"/>
    <text x="790" y="312" text-anchor="middle" font-size="12" font-weight="600">自然语言问答 → 视图操作</text>
  </g>
  <line x1="670" y1="230" x2="693" y2="230" stroke="#52514e" marker-end="url(#a)"/>
  <line x1="445" y1="295" x2="693" y2="200" stroke="#52514e" marker-end="url(#a)" stroke-dasharray="5 3"/>
  <text x="790" y="358" text-anchor="middle" font-size="11" fill="#898781">focus+context · 明暗双主题</text>
</svg>
